<nav class="rail">
    <a href="/" class="rail-brand">Ldav<span>Sync</span></a>
    <div class="rail-group">Area</div>
    <button class="rail-item{{if eq .Section "contacts"}} active{{end}}" data-area=""
            hx-get="/search" hx-target="#search-results"
            onclick="if(window.setActiveArea)setActiveArea(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        <span>{{index .Messages "area_all"}}</span><span class="n">{{.Total}}</span>
    </button>
    <button class="rail-item" data-area="interni"
            hx-get="/search?group=interni" hx-target="#search-results"
            onclick="if(window.setActiveArea)setActiveArea(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
        <span>{{index .Messages "area_interni"}}</span><span class="n">{{index .AreaCounts "interni"}}</span>
    </button>
    <button class="rail-item" data-area="esterni"
            hx-get="/search?group=esterni" hx-target="#search-results"
            onclick="if(window.setActiveArea)setActiveArea(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.2 2.4 3.4 5.6 3.4 9s-1.2 6.6-3.4 9c-2.2-2.4-3.4-5.6-3.4-9s1.2-6.6 3.4-9z"/></svg>
        <span>{{index .Messages "area_esterni"}}</span><span class="n">{{index .AreaCounts "esterni"}}</span>
    </button>
    <button class="rail-item" data-area="politica"
            hx-get="/search?group=politica" hx-target="#search-results"
            onclick="if(window.setActiveArea)setActiveArea(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/></svg>
        <span>{{index .Messages "area_politica"}}</span><span class="n">{{index .AreaCounts "politica"}}</span>
    </button>

    {{if .Username}}
    <div class="rail-group">Gestione</div>
    <a href="/admin" class="rail-item{{if eq .Section "admin"}} active{{end}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>{{index .Messages "admin_panel"}}</span>
    </a>
    <div class="rail-foot">
        {{.Username}}<br>
        <form method="POST" action="/logout" style="margin:0;">
            <button type="submit" style="background:none;border:none;padding:0;color:var(--danger);font-size:12px;cursor:pointer;">{{index .Messages "logout"}}</button>
        </form>
    </div>
    {{else}}
    <div class="rail-foot">
        <a href="/login">{{index .Messages "admin_panel"}}</a>
    </div>
    {{end}}
</nav>

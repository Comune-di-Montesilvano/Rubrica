<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{index .Messages "admin_panel"}} - {{index .Messages "app_title"}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="shell">
        {{template "rail.html" .}}

        <main class="main" style="max-width:920px;">
            <h1 class="page-title">{{index .Messages "admin_panel"}}</h1>

            <div class="grid2">
                <div class="card">
                    <h3>{{index .Messages "last_sync"}}</h3>
                    <div class="sync-time" id="last-sync-time">{{.LastSync}}</div>
                    <button hx-post="/admin/sync" hx-target="#sync-status" hx-swap="innerHTML" class="btn btn-primary" style="flex:none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0114.5-4.5L23 10M1 14l5 4.5A9 9 0 0020.5 15"/></svg>
                        {{index .Messages "sync_now"}}
                    </button>
                    <div id="sync-status"></div>
                </div>
                <div class="card">
                    <h3>{{index .Messages "primary_number_prefix"}}</h3>
                    <form hx-post="/admin/config" hx-target="#config-status" hx-swap="innerHTML" class="field-row">
                        <input type="text" name="primary_number_prefix" value="{{.PrimaryNumberPrefix}}" placeholder="0854321{ext}" class="input">
                        <button type="submit" class="btn btn-ghost" style="flex:none;">{{index .Messages "save"}}</button>
                    </form>
                    <span id="config-status" class="helptext"></span>
                </div>
            </div>

        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{index .Messages "app_title"}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="shell">
        {{template "rail.html" .}}

        <main class="main main-search">
            <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="search" name="q" id="search-q" placeholder="{{index .Messages "search_placeholder"}}"
                       hx-get="/search" hx-trigger="keyup changed delay:500ms" hx-include="#only-number"
                       hx-target="#search-results" hx-swap="innerHTML">
            </div>

            <div class="toolbar">
                <label class="toolbar-check">
                    <input type="checkbox" id="only-number" name="only_number"
                           hx-get="/search" hx-trigger="change" hx-include="#search-q"
                           hx-target="#search-results" hx-swap="innerHTML">
                    Solo con numero
                </label>
                <span class="toolbar-actions">
                    <button type="button" class="toolbar-link" title="Copia le email di tutti i contatti mostrati" onclick="copyEmails(event, document.getElementById('search-results'), this)">Copia email risultati</button>
                    <button type="button" class="toolbar-link" id="toggle-groups-btn" onclick="toggleAllGroups()">Comprimi tutto</button>
                </span>
            </div>

            <div class="prefix-helper" id="prefix-helper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
                <span>{{.PrefixHelperText}}</span>
                <button type="button" onclick="document.getElementById('prefix-helper').hidden = true; try { localStorage.setItem('ldavsync-prefix-helper-dismissed', '1'); } catch(e) {}" aria-label="Chiudi">&times;</button>
            </div>

            <div id="search-results" hx-get="/search{{if .InitialGroup}}?group={{.InitialGroup}}{{end}}" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
                <div class="loading-spinner"><p>Caricamento contatti...</p></div>
            </div>
        </main>
    </div>

    <div id="contact-modal" class="modal-overlay" hidden onclick="if(event.target===this)this.setAttribute('hidden','')">
        <div class="modal-box">
            <div class="modal-box-head">
                <h3>Dettaglio contatto</h3>
                <button onclick="document.getElementById('contact-modal').setAttribute('hidden','')">&times;</button>
            </div>
            <div id="contact-modal-content"></div>
        </div>
    </div>

    <script>
        function setActiveArea(btn) {
            document.querySelectorAll('.rail-item').forEach(function (i) { i.classList.remove('active'); });
            btn.classList.add('active');
        }
        // focusGroupRow apre la riga del gruppo (e ogni categoria annidata
        // che la contiene, risalendo la catena) e la scrolla in vista —
        // usata dal dropdown di ricerca sopra "Chiamate di gruppo".
        function focusGroupRow(number) {
            document.querySelectorAll('.group-search-dropdown').forEach(function (d) { d.style.display = 'none'; });
            var el = document.getElementById('group-' + number);
            if (!el) return;
            el.open = true;
            var parent = el.parentElement;
            while (parent) {
                var details = parent.closest('details.group-category-details, details.dept');
                if (!details) break;
                details.open = true;
                parent = details.parentElement;
            }
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        // copyEmails copia negli appunti le email (data-email delle righe
        // contatto) contenute in scope, separate da "; " così da poterle
        // incollare in blocco in A/Cc/Ccn di Outlook. Niente mailto: oltre
        // ~2000 caratteri (poche decine di indirizzi) viene troncato.
        // navigator.clipboard esiste solo in contesto sicuro (HTTPS o
        // localhost): sulla intranet in HTTP si ripiega su execCommand.
        function copyEmails(ev, scope, btn) {
            ev.preventDefault();
            ev.stopPropagation();
            var seen = {}, list = [];
            scope.querySelectorAll('[data-email]').forEach(function (el) {
                var e = el.getAttribute('data-email').trim();
                var k = e.toLowerCase();
                if (e && !seen[k]) { seen[k] = true; list.push(e); }
            });
            var label = btn.querySelector('.dept-copy-label') || btn;
            var original = label.getAttribute('data-original') || label.textContent;
            label.setAttribute('data-original', original);
            function done(msg) {
                label.textContent = msg;
                clearTimeout(btn._copyTimer);
                btn._copyTimer = setTimeout(function () { label.textContent = original; }, 2000);
            }
            if (!list.length) { done('Nessuna email'); return; }
            var text = list.join('; ');
            var ok = 'Copiate ' + list.length + ' email';
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(function () { done(ok); }, function () { done(fallbackCopy(text) ? ok : 'Copia non riuscita'); });
            } else {
                done(fallbackCopy(text) ? ok : 'Copia non riuscita');
            }
        }
        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return ok;
        }
        function toggleAllGroups() {
            var details = document.querySelectorAll('#search-results details.dept');
            var anyOpen = Array.prototype.some.call(details, function (d) { return d.open; });
            details.forEach(function (d) { d.open = !anyOpen; });
            document.getElementById('toggle-groups-btn').textContent = anyOpen ? 'Espandi tutto' : 'Comprimi tutto';
        }
        try {
            if (localStorage.getItem('ldavsync-prefix-helper-dismissed') === '1') {
                document.getElementById('prefix-helper').hidden = true;
            }
        } catch (e) {}
    </script>
</body>
</html>

<div id="members-list">
    {{if .Members}}
    <div class="modal-scroll-x">
    <table>
        <thead>
            <tr>
                <th>{{index .Messages "name"}}</th>
                <th>{{index .Messages "email"}}</th>
                <th>{{index .Messages "phone"}}</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {{range .Members}}
            <tr>
                <td>{{.DisplayName}}</td>
                <td class="member-count" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{.Email}}</td>
                <td class="member-count">{{if .LDAPExt}}int. {{extList .LDAPExt}}{{else if .PrimaryNumber}}{{.PrimaryNumber}}{{else}}&mdash;{{end}}</td>
                <td>
                    <button hx-post="/admin/groups/{{$.GroupID}}/members/{{.ID}}/delete"
                            hx-target="#members-list" hx-swap="outerHTML" class="btn-danger">
                        {{index $.Messages "delete"}}
                    </button>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    </div>
    {{else}}
    <p class="helptext" style="text-align:center;padding:16px 0;">Nessun membro</p>
    {{end}}
</div>

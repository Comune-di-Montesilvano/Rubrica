<div>
    <h3 class="page-title" style="font-size:15px;margin-bottom:14px;">{{.Group.Number}} &mdash; {{.Group.Name}}</h3>

    <div style="margin-bottom:18px;">
        <div class="helptext" style="margin-bottom:6px;">{{index .Messages "add_member"}}</div>
        <input type="text" name="q" class="input" style="width:100%;" placeholder="Cerca per nome..."
               hx-get="/admin/groups/{{.Group.ID}}/contacts/search"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#contact-search-results" hx-swap="innerHTML">
        <div id="contact-search-results">{{template "admin_contact_search.html" .}}</div>
    </div>

    {{template "admin_members_list.html" .}}

    <div style="display:flex;justify-content:flex-end;margin-top:18px;">
        <button type="button" class="btn btn-primary" style="flex:none;"
                onclick="document.getElementById('modal').setAttribute('hidden','')">
            Chiudi
        </button>
    </div>
</div>
